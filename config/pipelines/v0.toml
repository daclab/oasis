# OASIS v0 pipeline: ordered stages. Outputs are named <NN>_<name><ext> (ext default .mlir).
#
# Stage kinds:
#   export   : PyTorch -> linalg-on-tensors via torch_mlir.fx.export_and_import
#   frontend : MLIR pass list run by the frontend runner (see config/toolchain.toml [frontend])
#   tool     : external backend tool (see the backend section below)
#   fixup    : Python text fix-up between tools (oasis.backend.fixups)
#
# Frontend pass names were verified against the torch-mlir wheel 20261001 (2026-10-02) by
# parsing each one with torch_mlir.passmanager.PassManager. Re-verify when bumping the wheel.

[pipeline]
name = "v0"
# The hand-off file (last frontend stage) may contain only ops from these dialects.
handoff_dialects = ["builtin", "func", "scf", "memref", "arith"]

[[stage]]
name = "linalg"
kind = "export"

[[stage]]
name = "bufferized"
kind = "frontend"
passes = [
  "one-shot-bufferize{bufferize-function-boundaries function-boundary-type-conversion=identity-layout-map}",
  # Turn returned buffers into out-params written in place (C becomes the last argument).
  "buffer-results-to-out-params{modify-public-functions hoist-static-allocs}",
  "canonicalize",
  "cse",
]

[[stage]]
name = "affine"
kind = "frontend"
passes = [
  "func.func(convert-linalg-to-affine-loops)",
  "canonicalize",
]

[[stage]]
name = "scf"
kind = "frontend"
handoff = true
passes = [
  "lower-affine",
  "canonicalize",
  "cse",
]

# ---------------------------------------------------------------------------------------
# Backend (CIRCT's LLVM + Calyx). kind = "tool": run an external tool on the previous
# stage's file. Placeholders: {in} {out} {top} and any key from [paths] in toolchain.toml.
# stdout = true: the tool prints its result instead of taking -o.
# These flags come from From-Algorithm-to-RTL/examples/*/lower.sh and worked with local
# CIRCT a8cf045b3 on 2026-10-02.
# TODO(verify): check against circt-opt --help / hlstool --help for the pinned version.

# OASIS passes + upstream cleanups (oasis-opt, CIRCT's LLVM):
#   oasis-lower-memref-copy  memref.copy (e.g. conv zero-padding) -> load/store loop nests
#   lower-affine, fold-memref-alias-ops, lower-affine
#                            fold memref.subview/expand/collapse into index arithmetic;
#                            the second lower-affine removes the affine.apply the fold creates
#   arith-expand             arith.maximumf (max-pool) -> cmpf + select; hlstool has no maximumf
[[stage]]
name = "legalize"
kind = "tool"
tool = "oasis_opt"
args = ["{in}", "--oasis-lower-memref-copy", "--lower-affine", "--fold-memref-alias-ops",
        "--lower-affine", "--arith-expand", "--canonicalize", "--cse", "-o", "{out}"]

# Flatten every memref to 1-D (hlstool needs 1-D memories). OASIS's pass, not CIRCT's
# `flatten-memref`: CIRCT computes wrong addresses for rank >= 3 memrefs (it multiplies by
# the product of all remaining dimensions instead of the next one), which broke every
# NCHW tensor (relu, ResNet) while 2-D gemm/ffnn happened to be correct.
[[stage]]
name = "scf_flat"
kind = "tool"
tool = "oasis_opt"
args = ["{in}", "--oasis-flatten-memref", "--canonicalize", "--cse", "-o", "{out}"]

[[stage]]
name = "calyx"
kind = "tool"
tool = "hlstool"
args = ["--calyx-hw", "--output-level=core", "--top-level-function={top}", "--ir",
        "--allow-unregistered-dialects", "{in}", "-o", "{out}"]

[[stage]]
name = "export"
kind = "tool"
tool = "circt_translate"
ext = ".futil"
args = ["--export-calyx", "{in}", "-o", "{out}"]

# circt-translate prints float constants lossily (printf %f, `-inf`), and Calyx only parses
# unsigned decimal floats. Rewrite each as std_const with the exact bits from NN_calyx.mlir.
[[stage]]
name = "futil"
kind = "fixup"
fixup = "calyx_float_consts"
ext = ".futil"

# Simulation RTL: keeps $readmemh/$writememh/final for the testbench. The synthesis RTL is
# generated separately by `oasis tb` with `calyx --synthesis`.
[[stage]]
name = "verilog"
kind = "tool"
tool = "calyx"
ext = ".sv"
stdout = true
unlimited_stack = true  # calyx overflows the default 8 MB stack on ResNet-sized programs
args = ["-l", "{calyx_lib}", "-b", "verilog", "{in}"]

# Vivado rejects a port re-declared as a wire in the module body (VRFC 10-9336), which
# Calyx's HardFloat divider does (`output sqrtOpOut` ... `wire sqrtOpOut;`). Drop those
# redundant lines. This is the RTL the testbench and synthesis use.
[[stage]]
name = "design"
kind = "fixup"
fixup = "vivado_compat_sv"
ext = ".sv"
